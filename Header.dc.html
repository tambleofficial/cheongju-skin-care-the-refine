<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="./favicon.ico" sizes="any">
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://cdn.jsdelivr.net">

<style>
  *{box-sizing:border-box}
  a{text-decoration:none;color:inherit}
  @keyframes hdrField{0%{transform:translate3d(-4%,-3%,0) scale(1.05)}100%{transform:translate3d(5%,4%,0) scale(1.2)}}
</style>
</helmet>
<header style="position:fixed;top:0;left:0;width:100%;z-index:1000;background:{{ barBg }};backdrop-filter:{{ barBlur }};-webkit-backdrop-filter:{{ barBlur }};border-bottom:1px solid {{ barBorder }};transition:background .5s ease,border-color .5s ease,height .45s cubic-bezier(.22,.61,.36,1);height:{{ barH }};font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Helvetica Neue',sans-serif">
  <div style="max-width:1240px;height:100%;margin:0 auto;padding:0 clamp(20px,5vw,44px);display:flex;align-items:center;justify-content:space-between;gap:20px">
    <a href="index.dc.html" style="display:flex;align-items:center;gap:12px" aria-label="더리파인 에스테틱 홈">
      <img src="{{ brandLogo }}" alt="THE RE:FINE 로고" width="34" height="34" style="width:clamp(28px,3vw,34px);height:auto;display:block;transition:opacity .5s ease">
      <span style="display:flex;flex-direction:column;line-height:1">
        <span style="font-size:clamp(15px,1.5vw,17px);font-weight:600;letter-spacing:.14em;color:{{ ink }};transition:color .5s ease">THE RE:FINE</span>
        <span style="font-size:10px;font-weight:500;letter-spacing:.18em;margin-top:4px;color:{{ inkMuted }};transition:color .5s ease">청주 퍼스널 에스테틱</span>
      </span>
    </a>

    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:clamp(22px,3vw,40px)" aria-label="주 메뉴">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
          <a href="{{ it.href }}" style="position:relative;font-size:13px;font-weight:500;letter-spacing:.13em;padding:6px 0;color:{{ it.color }};transition:color .35s ease">
            {{ it.label }}
            <span style="position:absolute;left:0;bottom:-1px;height:1.5px;width:{{ it.underline }};background:{{ it.underlineColor }};transition:width .4s cubic-bezier(.22,.61,.36,1)"></span>
          </a>
        </sc-for>
        <a href="https://map.naver.com/p/entry/place/2037698163" target="_blank" rel="noopener noreferrer" style="font-size:12.5px;font-weight:600;letter-spacing:.12em;padding:11px 22px;border-radius:2px;border:1px solid {{ resBorder }};background:{{ resBg }};color:{{ resInk }};transition:all .4s ease" onMouseEnter="{{ resEnter }}" onMouseLeave="{{ resLeave }}">RESERVATION</a>
      </nav>
    </sc-if>

    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggle }}" aria-label="메뉴 열기" aria-expanded="{{ menuOpen }}" style="position:relative;z-index:1001;display:flex;flex-direction:column;justify-content:center;gap:6px;width:44px;height:44px;background:none;border:none;cursor:pointer;padding:8px">
        <span style="height:1.5px;width:26px;background:{{ barColor }};transition:all .4s ease;transform:{{ bar1 }}"></span>
        <span style="height:1.5px;width:26px;background:{{ barColor }};transition:all .3s ease;opacity:{{ bar2o }}"></span>
        <span style="height:1.5px;width:26px;background:{{ barColor }};transition:all .4s ease;transform:{{ bar3 }}"></span>
      </button>
    </sc-if>
  </div>

  <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:998;overflow:hidden;transition:opacity .5s ease;opacity:{{ drawerOpacity }};pointer-events:{{ drawerPE }};visibility:{{ drawerVis }}">
      <div style="position:absolute;inset:0;background:#0c1f58"></div>
      <div style="position:absolute;inset:-25%;background:radial-gradient(55% 55% at 30% 28%,#2444c7 0%,transparent 60%),radial-gradient(50% 55% at 78% 42%,#3a5bdc 0%,transparent 55%),radial-gradient(65% 60% at 60% 82%,#071337 0%,transparent 60%);filter:blur(46px);animation:hdrField 30s ease-in-out infinite alternate"></div>
      <div style="position:relative;height:100%;padding:118px clamp(24px,8vw,52px) 44px;display:flex;flex-direction:column">
        <nav style="display:flex;flex-direction:column" aria-label="모바일 메뉴">
          <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
            <a href="{{ it.href }}" style="display:flex;align-items:baseline;gap:18px;padding:clamp(14px,2.4vh,20px) 0;border-bottom:1px solid rgba(255,255,255,.14);color:#fff;opacity:{{ it.mo }};transform:{{ it.mt }};transition:opacity .6s ease {{ it.md }},transform .7s cubic-bezier(.16,.72,.2,1) {{ it.md }}">
              <span style="font-size:12px;font-weight:600;letter-spacing:.14em;color:{{ it.numColor }};padding-top:10px">{{ it.num }}</span>
              <span style="font-size:clamp(30px,9vw,44px);font-weight:600;letter-spacing:-.01em">{{ it.label }}</span>
            </a>
          </sc-for>
        </nav>
        <div style="margin-top:auto;display:flex;flex-direction:column;gap:12px;opacity:{{ drawerOpacity }};transition:opacity .6s ease .42s">
          <a href="https://map.naver.com/p/entry/place/2037698163" target="_blank" rel="noopener noreferrer" style="text-align:center;font-size:14px;font-weight:600;letter-spacing:.12em;padding:19px;background:#fff;color:#1e3fc2">RESERVATION</a>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <a href="https://pf.kakao.com/_QLXRX" target="_blank" rel="noopener noreferrer" style="text-align:center;font-size:13px;font-weight:600;letter-spacing:.05em;padding:15px;border:1px solid rgba(255,255,255,.4);color:#fff">카카오톡 상담</a>
            <a href="tel:050713148454" style="text-align:center;font-size:13px;font-weight:600;letter-spacing:.05em;padding:15px;border:1px solid rgba(255,255,255,.4);color:#fff">전화 문의</a>
          </div>
        </div>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:120},&quot;current&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;overHero&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { isMobile:false, menuOpen:false, scrolled:false, resHover:false };
  componentDidMount(){
    this.mq = window.matchMedia('(max-width: 880px)');
    this._setM = () => this.setState({ isMobile:this.mq.matches, menuOpen:false });
    this._setM();
    this.mq.addEventListener('change', this._setM);
    this.onScroll = () => {
      const th = this.props.overHero ? Math.max(80, window.innerHeight*0.55) : 12;
      const s = window.scrollY > th;
      if (s !== this.state.scrolled) this.setState({ scrolled:s });
    };
    window.addEventListener('scroll', this.onScroll, { passive:true });
    this.onScroll();
  }
  componentWillUnmount(){
    window.removeEventListener('scroll', this.onScroll);
    if(this.mq) this.mq.removeEventListener('change', this._setM);
    document.body.style.overflow='';
  }
  componentDidUpdate(){
    document.body.style.overflow = (this.state.isMobile && this.state.menuOpen) ? 'hidden' : '';
  }
  renderVals(){
    const overHero = this.props.overHero === true || this.props.overHero === 'true';
    const current = this.props.current || '';
    const light = overHero && !this.state.scrolled && !this.state.menuOpen;
    const ink = light ? '#ffffff' : '#161616';
    const inkMuted = light ? 'rgba(255,255,255,.72)' : '#8a8a8a';
    const nav = [
      ['BRAND','about.dc.html','about'],
      ['PROGRAM','program.dc.html','program'],
      ['CURATION','process.dc.html','process'],
      ['RESULT','archive.dc.html','archive'],
      ['RESERVATION','contact.dc.html','contact'],
    ];
    const items = nav.map(([label,href,key],i)=>({
      label, href, key,
      color: light ? (key===current?'#ffffff':'rgba(255,255,255,.78)') : (key===current?'#1e3fc2':'#4a4a4a'),
      underline: key===current ? '100%' : '0%',
      underlineColor: light ? '#ffffff' : '#1e3fc2',
      dot: key===current ? 1 : 0.18,
      num: '0'+(i+1),
      numColor: key===current ? '#ffffff' : 'rgba(255,255,255,.5)',
      mo: this.state.menuOpen ? 1 : 0,
      mt: this.state.menuOpen ? 'translateY(0)' : 'translateY(26px)',
      md: (this.state.menuOpen ? (0.14 + i*0.07) : 0) + 's',
    }));
    return {
      items, ink, inkMuted,
      desktop: !this.state.isMobile,
      mobile: this.state.isMobile,
      menuOpen: this.state.menuOpen,
      barBg: light ? 'transparent' : 'rgba(255,255,255,.86)',
      barBlur: light ? 'none' : 'saturate(140%) blur(16px)',
      barBorder: light ? 'rgba(255,255,255,0)' : '#ededec',
      barH: (this.state.scrolled ? 62 : 86) + 'px',
      brandLogo: light ? 'assets/logo-white.png' : 'assets/logo-blue.png',
      resBorder: light ? 'rgba(255,255,255,.5)' : (this.state.resHover?'#1e3fc2':'#1e3fc2'),
      resBg: this.state.resHover ? '#1e3fc2' : (light?'rgba(255,255,255,.06)':'#ffffff'),
      resInk: this.state.resHover ? '#ffffff' : (light?'#ffffff':'#1e3fc2'),
      resEnter: ()=>this.setState({resHover:true}),
      resLeave: ()=>this.setState({resHover:false}),
      barColor: this.state.menuOpen ? '#ffffff' : ink,
      toggle: ()=>this.setState(s=>({menuOpen:!s.menuOpen})),
      bar1: this.state.menuOpen ? 'translateY(7.5px) rotate(45deg)' : 'none',
      bar3: this.state.menuOpen ? 'translateY(-7.5px) rotate(-45deg)' : 'none',
      bar2o: this.state.menuOpen ? 0 : 1,
      drawerOpacity: this.state.menuOpen ? 1 : 0,
      drawerTransform: this.state.menuOpen ? 'translateY(0)' : 'translateY(-12px)',
      drawerPE: this.state.menuOpen ? 'auto' : 'none',
      drawerVis: this.state.menuOpen ? 'visible' : 'hidden',
    };
  }
}
</script>
</body>
</html>
